# change-element-mapping.yaml
# v1.2.0 Layer 3.5 - 原子变化点到 PRD 要素的影响映射
#
# impact_level：
#   certain     - 一定影响，必须执行
#   likely      - 通常影响，默认执行（用户可跳过）
#   conditional - 条件影响，根据 condition 判断或交由用户决定

change_element_mappings:

  # ─── UI 类 ────────────────────────────────────────
  - change_id: "UI-01"
    affects:
      - element_id: "ui-prototype"
        impact_level: "certain"
        reason: "新增按钮直接影响页面规格"
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新增按钮对应新增子特性或子特性扩展"
      - element_id: "permission-design"
        impact_level: "likely"
        reason: "新按钮通常需要权限控制"
      - element_id: "scenario-solution"
        impact_level: "likely"
        reason: "新按钮对应的操作可能形成新场景"

  - change_id: "UI-02"
    affects:
      - element_id: "ui-prototype"
        impact_level: "certain"
        reason: "新增页面直接影响页面清单和流转图"
      - element_id: "app-architecture"
        impact_level: "certain"
        reason: "新页面对应新子特性，影响架构"
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新页面需要新子特性详细规格"
      - element_id: "permission-design"
        impact_level: "certain"
        reason: "新页面需要权限分配"
      - element_id: "scenario-solution"
        impact_level: "likely"
        reason: "新页面可能引入新场景"

  - change_id: "UI-03"
    affects:
      - element_id: "ui-prototype"
        impact_level: "certain"
        reason: "字段增减影响页面规格"
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "字段增减通常对应实体属性增减"
      - element_id: "feature-spec"
        impact_level: "likely"
        reason: "可能影响子特性的字段说明"

  - change_id: "UI-04"
    affects:
      - element_id: "ui-prototype"
        impact_level: "certain"
        reason: "布局调整直接影响页面规格"

  - change_id: "UI-05"
    affects:
      - element_id: "ui-prototype"
        impact_level: "certain"
        reason: "流转关系调整影响 Pageflow"
      - element_id: "scenario-solution"
        impact_level: "likely"
        reason: "页面流转影响场景串联"

  # ─── DA 类 ────────────────────────────────────────
  - change_id: "DA-01"
    affects:
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "新增实体直接影响实体清单和 ER 图"
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新实体需要 CRUD 子特性"
      - element_id: "scenario-solution"
        impact_level: "likely"
        reason: "新实体可能引入新场景"

  - change_id: "DA-02"
    affects:
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "字段新增影响实体详情表"
      - element_id: "ui-prototype"
        impact_level: "likely"
        reason: "新字段通常对应页面显示"
      - element_id: "feature-spec"
        impact_level: "likely"
        reason: "新字段可能影响验收标准"

  - change_id: "DA-03"
    affects:
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "字段修改/删除影响实体详情"
      - element_id: "ui-prototype"
        impact_level: "likely"
      - element_id: "feature-spec"
        impact_level: "likely"
      - element_id: "integration-design"
        impact_level: "conditional"
        condition: "若该字段曾用于外部接口参数映射"
        reason: "可能需要更新接口字段"

  - change_id: "DA-04"
    affects:
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "关系变更直接影响 ER 图和实体详情外键标注"
      - element_id: "feature-spec"
        impact_level: "likely"
      - element_id: "permission-design"
        impact_level: "conditional"
        condition: "若涉及数据权限范围"

  - change_id: "DA-05"
    affects:
      - element_id: "info-architecture"
        impact_level: "certain"
        reason: "状态变更影响状态流转图"
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新状态通常需要新功能或现有功能扩展"
      - element_id: "ui-prototype"
        impact_level: "likely"

  # ─── LG 类 ────────────────────────────────────────
  - change_id: "LG-01"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新业务规则直接写入子特性的业务规则列表"
      - element_id: "scenario-solution"
        impact_level: "likely"

  - change_id: "LG-02"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
      - element_id: "config-design"
        impact_level: "conditional"
        condition: "若调整阈值是可配置项"

  - change_id: "LG-03"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
      - element_id: "info-architecture"
        impact_level: "conditional"
        condition: "若新计算逻辑需要新字段"

  - change_id: "LG-04"
    affects:
      - element_id: "permission-design"
        impact_level: "certain"
      - element_id: "feature-spec"
        impact_level: "likely"
      - element_id: "scenario-solution"
        impact_level: "likely"

  # ─── PR 类 ────────────────────────────────────────
  - change_id: "PR-01"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "新流程节点对应新子特性"
      - element_id: "scenario-solution"
        impact_level: "certain"
        reason: "流程节点新增直接影响场景串联"
      - element_id: "permission-design"
        impact_level: "likely"
      - element_id: "ui-prototype"
        impact_level: "likely"

  - change_id: "PR-02"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
      - element_id: "scenario-solution"
        impact_level: "certain"
      - element_id: "ui-prototype"
        impact_level: "likely"

  - change_id: "PR-03"
    affects:
      - element_id: "scenario-solution"
        impact_level: "certain"
      - element_id: "feature-spec"
        impact_level: "likely"

  - change_id: "PR-04"
    affects:
      - element_id: "feature-spec"
        impact_level: "certain"
        reason: "异常分支增加新的验收标准"
      - element_id: "scenario-solution"
        impact_level: "certain"

  - change_id: "PR-05"
    affects:
      - element_id: "permission-design"
        impact_level: "certain"
      - element_id: "feature-spec"
        impact_level: "likely"
      - element_id: "scenario-solution"
        impact_level: "likely"

  # ─── IN 类 ────────────────────────────────────────
  - change_id: "IN-01"
    affects:
      - element_id: "integration-design"
        impact_level: "certain"
      - element_id: "app-architecture"
        impact_level: "certain"
        reason: "新增外部依赖影响系统边界表"
      - element_id: "feature-spec"
        impact_level: "likely"
        reason: "可能引入新的集成型子特性"
      - element_id: "scenario-solution"
        impact_level: "likely"

  - change_id: "IN-02"
    affects:
      - element_id: "integration-design"
        impact_level: "certain"

  - change_id: "IN-03"
    affects:
      - element_id: "integration-design"
        impact_level: "certain"

  - change_id: "IN-04"
    affects:
      - element_id: "integration-design"
        impact_level: "certain"
      - element_id: "nfr"
        impact_level: "likely"
        reason: "降级策略可能涉及可用性指标"

  # ─── NF 类 ────────────────────────────────────────
  - change_id: "NF-01"
    affects:
      - element_id: "nfr"
        impact_level: "certain"
      - element_id: "app-architecture"
        impact_level: "conditional"
        condition: "若性能要求变化导致架构方案调整（如增加缓存层）"

  - change_id: "NF-02"
    affects:
      - element_id: "nfr"
        impact_level: "certain"
      - element_id: "info-architecture"
        impact_level: "likely"
        reason: "脱敏规则可能新增字段标注"
      - element_id: "permission-design"
        impact_level: "likely"

  - change_id: "NF-03"
    affects:
      - element_id: "nfr"
        impact_level: "certain"
      - element_id: "integration-design"
        impact_level: "conditional"
        condition: "若 SLA 变更影响外部依赖处理策略"