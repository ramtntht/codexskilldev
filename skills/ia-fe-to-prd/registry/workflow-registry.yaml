workflows:
  - id: "prd-resume"
    name: "续接恢复"
    priority: 100
    input_signature:
      required:
        - id: "PRD_DOC_INPROGRESS"
          reason: "存在进行中的 PRD 文档。"
      excluded: []
      optional:
        - id: "FE_DOC_ANY"
          reason: "可选加载 FE 上下文辅助续写。"
    trigger_keywords: ["继续", "resume", "从上次继续", "接着做"]
    orchestration_file: "orchestration/o-init-build.md"
    resume_mode: true
    element_sequence: []
    status: "active"

  - id: "review-modify"
    name: "PRD 评审修改"
    priority: 80
    input_signature:
      required:
        - id: "PRD_HISTORICAL"
          reason: "必须有目标 PRD 文档（已完成状态的历史 PRD，供本次修改）。"
        - id: "REVIEW_COMMENTS"
          reason: "必须有评审意见（文字描述或带标注文档均可，o-review-modify 内部区分）。"
      excluded:
        - id: "PRD_DOC_INPROGRESS"
          reason: "存在进行中 PRD 时优先走续接恢复。"
      optional:
        - id: "FE_DOC_ANY"
          reason: "可选提供 FE 作为修改时的上游上下文。"
    trigger_keywords: ["评审修改", "根据评审意见", "修改PRD", "按意见改", "有评审标注"]
    orchestration_file: "orchestration/o-review-modify.md"
    element_sequence: []
    status: "active"

  - id: "tp-incremental-build"
    name: "TP 增量 PRD 设计"
    priority: 60
    input_signature:
      required:
        - id: "FE_DOC_COMPLETED"
          reason: "必须有已完成的新 FE 文档。"
        - id: "PRD_HISTORICAL"
          reason: "必须有历史 PRD 作为增量基线。"
      excluded:
        - id: "PRD_DOC_INPROGRESS"
          reason: "存在进行中 PRD 时优先走续接恢复。"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时属于 review-modify 场景。"
      optional: []
    trigger_keywords: ["增量设计", "优化需求", "1-n", "在现有PRD基础上"]
    requirement_type: "TP"
    requirement_nature: "优化需求"
    orchestration_file: "orchestration/o-incremental-build.md"
    element_sequence: []
    status: "active"

  - id: "tp-new-build"
    name: "TP 专题需求 PRD 设计"
    priority: 40
    input_signature:
      required:
        - id: "FE_DOC_COMPLETED"
          reason: "必须有已完成的 FE 文档。"
      excluded:
        - id: "PRD_HISTORICAL"
          reason: "存在历史 PRD 时优先走增量设计。"
        - id: "PRD_DOC_INPROGRESS"
          reason: "存在进行中 PRD 时优先走续接恢复。"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时属于 review-modify 场景。"
      optional: []
    trigger_keywords: ["创建PRD", "生成PRD", "产品方案设计", "需求转PRD", "新建PRD"]
    requirement_type: "TP"
    requirement_nature: "专题需求"
    orchestration_file: "orchestration/o-init-build.md"
    # element_sequence 已删除 - 改为由 orchestration 根据 element-type-registry 动态计算
    status: "active"

  - id: "ap-new-build"
    name: "AP 专题需求 PRD 设计"
    priority: 40
    input_signature:
      required:
        - id: "FE_DOC_COMPLETED"
          reason: "必须有已完成的 FE 文档。"
      excluded:
        - id: "PRD_HISTORICAL"
          reason: "存在历史 PRD 时优先走增量设计。"
        - id: "PRD_DOC_INPROGRESS"
          reason: "存在进行中 PRD 时优先走续接恢复。"
        - id: "REVIEW_COMMENTS"
          reason: "存在评审意见时属于 review-modify 场景。"
      optional: []
    trigger_keywords: ["创建PRD", "生成PRD", "产品方案设计", "需求转PRD", "新建PRD"]
    requirement_type: "AP"
    requirement_nature: "专题需求"
    orchestration_file: "orchestration/o-init-build.md"
    # element_sequence 已删除 - 改为由 orchestration 根据 element-type-registry 动态计算
    status: "planned"
