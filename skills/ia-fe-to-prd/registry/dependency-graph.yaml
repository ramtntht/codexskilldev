impact_edges:
  - source: "product-positioning"
    targets:
      - element: "app-architecture"
        impact_type: "direct"
        reason: "产品目标与范围变更会直接影响模块边界和特性划分。"
      - element: "nfr"
        impact_type: "indirect"
        reason: "成功标准变化可能影响性能、可用性等目标。"

  - source: "app-architecture"
    targets:
      - element: "info-architecture"
        impact_type: "direct"
        reason: "特性边界变化会影响实体归属。"
      - element: "feature-spec"
        impact_type: "direct"
        reason: "子特性编号体系来源于应用架构。"
      - element: "permission-design"
        impact_type: "direct"
        reason: "权限矩阵基于子特性清单。"
      - element: "integration-design"
        impact_type: "direct"
        reason: "系统依赖表是集成设计的输入。"
      - element: "scenario-solution"
        impact_type: "indirect"
        reason: "子特性分布变化会影响场景串联。"

  - source: "info-architecture"
    targets:
      - element: "feature-spec"
        impact_type: "direct"
        reason: "实体操作说明依赖实体定义。"
      - element: "scenario-solution"
        impact_type: "direct"
        reason: "场景表中的操作实体来自信息架构。"
      - element: "integration-design"
        impact_type: "indirect"
        reason: "字段调整可能影响接口参数映射。"

  - source: "feature-spec"
    targets:
      - element: "permission-design"
        impact_type: "direct"
        reason: "权限矩阵需要与子特性同步。"
      - element: "scenario-solution"
        impact_type: "direct"
        reason: "场景串联依赖子特性清单。"
      - element: "story-design"
        impact_type: "direct"
        reason: "Story 直接从功能特性与验收标准拆分。"

  - source: "permission-design"
    targets:
      - element: "scenario-solution"
        impact_type: "indirect"
        reason: "角色权限变更会影响场景中的执行角色边界。"

  - source: "integration-design"
    targets:
      - element: "scenario-solution"
        impact_type: "indirect"
        reason: "外部系统调用步骤会影响场景链路。"

  - source: "nfr"
    targets:
      - element: "story-design"
        impact_type: "direct"
        reason: "非功能特性是 NFR Story 的直接来源。"

incremental_impact_rules:
  change_types:
    - type: "A"
      name: "新增实体"
      impacts:
        D1_product_positioning: false
        D2_app_architecture: false
        D3_info_architecture: true
        D4_feature_spec: true
        D5_permission_design: false
        D6_integration_design: true
        D7_config_design: false
        D8_scenario_solution: true
        D9_nfr: false
        D10_story_design: true

    - type: "B"
      name: "实体字段变更"
      impacts:
        D1_product_positioning: false
        D2_app_architecture: false
        D3_info_architecture: true
        D4_feature_spec: true
        D5_permission_design: false
        D6_integration_design: true
        D7_config_design: false
        D8_scenario_solution: false
        D9_nfr: false
        D10_story_design: true

    - type: "C"
      name: "新增或修改子特性"
      impacts:
        D1_product_positioning: false
        D2_app_architecture: true
        D3_info_architecture: false
        D4_feature_spec: true
        D5_permission_design: true
        D6_integration_design: false
        D7_config_design: false
        D8_scenario_solution: true
        D9_nfr: false
        D10_story_design: true

    - type: "D"
      name: "权限规则变更"
      impacts:
        D1_product_positioning: false
        D2_app_architecture: false
        D3_info_architecture: false
        D4_feature_spec: false
        D5_permission_design: true
        D6_integration_design: false
        D7_config_design: false
        D8_scenario_solution: true
        D9_nfr: false
        D10_story_design: true

    - type: "E"
      name: "性能或非功能优化"
      impacts:
        D1_product_positioning: false
        D2_app_architecture: false
        D3_info_architecture: false
        D4_feature_spec: false
        D5_permission_design: false
        D6_integration_design: false
        D7_config_design: false
        D8_scenario_solution: false
        D9_nfr: true
        D10_story_design: true

    - type: "F"
      name: "多改动点组合"
      impacts:
        note: "由 orchestration/o-incremental-build.md 按包含的 A-E 子类型合并所有 true 项。"

  dimension_mapping:
    D1: "product-positioning"
    D2: "app-architecture"
    D3: "info-architecture"
    D4: "feature-spec"
    D5: "permission-design"
    D6: "integration-design"
    D7: "config-design"
    D8: "scenario-solution"
    D9: "nfr"
    D10: "story-design"
