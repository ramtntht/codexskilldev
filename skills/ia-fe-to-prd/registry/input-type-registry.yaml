# input-type-registry.yaml
# 职责：定义影响场景路由的核心输入变量。
# 设计原则：只提取"真正影响场景路由差异"的变量；对话类输入和文件类输入的内部区分
#           由 orchestration 层处理，不在此注册。
#
# 所有 detection 规则由 workflow-engine.md 的 Input Inventory 构建阶段执行。

input_types:

  - id: "FE_DOC_COMPLETED"
    name: "已完成的 FE 文档"
    detection: |
      workspace/requirements/{current_version}/FE-*.md 存在
      AND frontmatter.status == "completed"
    provision_guide: "请先完成 FE 文档，或明确提供完成态 FE 文档路径。"
    description: "PRD 新建和增量设计的核心输入。完成态 FE 是进入 init_build 或 incremental_build 的必要条件。"

  - id: "FE_DOC_ANY"
    name: "FE 文档（任意状态）"
    detection: |
      workspace/requirements/{current_version}/FE-*.md 存在（不检查 status）
    provision_guide: "当前版本的 FE 文档尚未完成，只能提供有限上下文参考。"
    description: "评审修改场景下可选加载的 FE 上下文。status != completed 时匹配此项。"

  - id: "PRD_DOC_INPROGRESS"
    name: "进行中的 PRD 文档"
    detection: |
      workspace/design/{current_version}/PRD-*.md 存在
      AND frontmatter.status == "in_progress"
    provision_guide: "系统检测到未完成的 PRD 文档，可续接上次进度继续执行。"
    description: "续接恢复场景（intent=resume）的关键判据，也是 init_build 场景最高优先级条件。"

  - id: "PRD_HISTORICAL"
    name: "历史已完成 PRD"
    detection: |
      workspace/design/*/PRD-*.md 存在（任意历史版本目录，不限于 current_version）
      AND frontmatter.status == "completed"
      AND frontmatter.project_name == ongoing.project_name  ← 关键：同项目匹配，避免多项目误匹配
    provision_guide: "提供历史 PRD 路径，或说明要基于哪个历史版本做增量设计或评审修改。"
    description: |
      两种场景合并：
      1. 增量设计场景（incremental_build）的基线 PRD 输入
      2. 评审修改场景（review_modify）的目标 PRD（已完成但需修改）
      orchestration 层根据 intent 区分具体使用方式。

      **多项目并存场景修复**：检测逻辑限定为同 project_name 匹配，避免误将其他项目的历史PRD识别为当前项目的基线。

  - id: "REVIEW_COMMENTS"
    name: "评审意见"
    detection: |
      以下任一条件满足：
      条件 A（文字意见）：用户当前输入满足以下任一：
        - 提及章节编号（如"2.1""第三章"）并给出修改描述
        - 包含关键词 [补充/增加/修改/调整/删除/精简] 与具体内容
        - 明确说"根据评审意见""按以下意见修改"
      条件 B（带标注文档）：用户提供的文档中包含 ==文本==[^n] 格式高亮标注
        AND 底部存在 [^n]: 脚注说明
    provision_guide: |
      评审意见提供方式：
      1. 文字描述：直接在对话中描述修改意见（如"将2.1节的范围表格改为..."）
      2. 标注文档：提供带 ==高亮==[^n] 脚注标注格式的评审文档
    description: |
      合并了原 REVIEW_COMMENTS_TEXT 和 REVIEW_COMMENTS_DOC。
      路由层只需知道"有无评审意见"，意见的具体形式（文字 vs 文档标注）
      由 o-review-modify.md 在 Action 1 阶段内部识别和处理。
