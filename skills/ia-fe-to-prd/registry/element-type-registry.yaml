element_types:
  - id: "product-positioning"
    name: "定位与目标"
    chapter_no: 1
    chapter_no_cn: "一"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "1.1", name: "用户和干系人" }
      - { l2_no: "1.2", name: "痛点和价值" }
      - { l2_no: "1.3", name: "范围和边界" }
      - { l2_no: "1.4", name: "产品目标" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "用户和干系人、痛点和价值、范围和边界、产品目标。"

  - id: "app-architecture"
    name: "应用架构"
    chapter_no: 2
    chapter_no_cn: "二"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "2.1", name: "应用架构图" }
      - { l2_no: "2.2", name: "系统边界" }
      - { l2_no: "2.3", name: "特性分类/特性/子特性" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "应用架构图、系统边界、特性分类/特性/子特性。"

  - id: "ui-prototype"
    name: "界面原型"
    chapter_no: 3
    chapter_no_cn: "三"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "3.1", name: "页面清单" }
      - { l2_no: "3.2", name: "页面功能规格" }
      - { l2_no: "3.3", name: "菜单结构" }
      - { l2_no: "3.4", name: "Pageflow" }
      - { l2_no: "3.5", name: "兼容性要求" }
      - { l2_no: "3.6", name: "交互原型" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "页面清单、页面功能规格、菜单结构、Pageflow、兼容性要求、交互原型。"

  - id: "info-architecture"
    name: "信息架构"
    chapter_no: 4
    chapter_no_cn: "四"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "4.1", name: "业务对象/逻辑实体" }
      - { l2_no: "4.2", name: "实体关系图" }
      - { l2_no: "4.3", name: "实体详情" }
      - { l2_no: "4.4", name: "实体状态流转" }
      - { l2_no: "4.5", name: "数据样例" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "业务对象/逻辑实体、实体关系图、实体详情、实体状态流转、数据样例。"

  - id: "feature-spec"
    name: "功能特性"
    chapter_no: 5
    chapter_no_cn: "五"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "5.1", name: "子特性基本信息" }
      - { l2_no: "5.2", name: "特性分类" }
      - { l2_no: "5.3", name: "子特性详细规格" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "子特性基本信息、特性分类、子特性详细规格。"

  - id: "permission-design"
    name: "权限设计"
    chapter_no: 6
    chapter_no_cn: "六"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "6.1", name: "角色定义" }
      - { l2_no: "6.2", name: "功能权限矩阵" }
      - { l2_no: "6.3", name: "数据权限规则" }
    belongs_to: ["TP", "AP"]
    optional: false
    backend_only: false
    description: "角色定义、功能权限矩阵、数据权限规则。"

  - id: "integration-design"
    name: "集成设计"
    chapter_no: 7
    chapter_no_cn: "七"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "7.1", name: "集成点" }
      - { l2_no: "7.2", name: "API" }
      - { l2_no: "7.3", name: "MQS" }
      - { l2_no: "7.4", name: "数据集成" }
    belongs_to: ["TP", "AP", "AI"]
    optional: true
    backend_only: false
    description: "集成点、API、MQS、数据集成。"

  - id: "config-design"
    name: "配置设计"
    chapter_no: 8
    chapter_no_cn: "八"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "8.1", name: "用户配置项" }
      - { l2_no: "8.2", name: "IT管理配置项" }
    belongs_to: ["TP", "AP"]
    optional: true
    backend_only: false
    description: "用户配置项与 IT 管理配置项。"

  - id: "scenario-solution"
    name: "场景解决方案"
    chapter_no: 9
    chapter_no_cn: "九"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "9.1", name: "场景清单" }
      - { l2_no: "9.2", name: "解决方案集成图" }
      - { l2_no: "9.3", name: "场景详细描述" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "场景清单、解决方案集成图、场景详细描述。"

  - id: "nfr"
    name: "非功能需求"
    chapter_no: 10
    chapter_no_cn: "十"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "10.1", name: "性能要求" }
      - { l2_no: "10.2", name: "埋点要求" }
      - { l2_no: "10.3", name: "安全隐私" }
      - { l2_no: "10.4", name: "易用性" }
      - { l2_no: "10.5", name: "可维护性" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "性能要求、埋点要求、安全隐私、易用性、可维护性。"

  - id: "story-design"
    name: "Story 设计"
    chapter_no: 11
    chapter_no_cn: "十一"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "11.1", name: "Story 清单" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    always_affected_in: ["modify", "incremental"]
    description: "Story 清单（详情在独立文件）。"