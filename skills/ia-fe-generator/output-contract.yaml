output_contract_version: "1.0.0"
skill_id: "ia-fe-generator"

frontmatter_schema:
  required_fields:
    - name: "workflow_id"
      type: "string"
      values: ["tp-new-build", "tp-incremental-build", "fe-review-modify"]
    - name: "requirement_type"
      type: "string"
      values: ["TP", "AP", "AI", "IT"]
    - name: "requirement_nature"
      type: "string"
      values: ["专题需求", "优化需求"]
    - name: "status"
      type: "string"
      values: ["in_progress", "completed"]
    - name: "stepsCompleted"
      type: "list[string]"
      description: "已完成的 element_id 列表"
    - name: "last_element"
      type: "string"
    - name: "last_updated"
      type: "string"
      format: "YYYY-MM-DD"

content_schema:
  guaranteed_chapters:
    - chapter_no: 1
      element_id: "original-requirement"
      sub_elements_guaranteed:
        - "原始需求来源记录"
        - "原始需求描述"
        - "关键信息提取矩阵"
    - chapter_no: 2
      element_id: "business-background"
      sub_elements_guaranteed:
        - "现状和痛点"
        - "目标和价值"
        - "业务范围"
    - chapter_no: 4
      element_id: "business-process"
      sub_elements_guaranteed:
        - "业务流程图"
        - "活动总览"
        - "活动明细"
        - "角色清单"
        - "输入信息"
        - "输出结果"
        - "业务规则"
        - "外部依赖记录"
    - chapter_no: 5
      element_id: "business-function"
      sub_elements_guaranteed:
        - "功能清单"
        - "功能详细描述"
        - "业务权限矩阵"
    - chapter_no: 6
      element_id: "user-interaction"
      sub_elements_guaranteed:
        - "页面清单"
        - "页面流转图"
        - "页面低保真草图"

versioning_policy:
  - "新增章节、新增字段：minor 版本递增"
  - "删除章节、删除字段、字段语义变更：major 版本递增"
  - "下游 Skill 的 min_contract_version 用 ^ 语义"