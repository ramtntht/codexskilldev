# change-element-mapping.yaml
# FE Skill v1.2.0 Layer 3.5 - 变化点到 FE 要素的影响映射
#
# impact_level:
#   certain     - 一定影响,自动加入 effective_sequence
#   likely      - 通常影响,默认加入但可跳过
#   conditional - 条件影响,根据 condition 判断或交由用户决定

change_element_mappings:

  # ─── PR 类映射 ────────────────────────────────────
  - change_id: "PR-01"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "流程图、活动总览、活动明细新增节点"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "新节点通常对应新功能"
      - element_id: "user-interaction"
        impact_level: "conditional"
        condition: "新节点需要 UI 承载"
        reason: "若新节点为人工操作,需要新页面"

  - change_id: "PR-02"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "节点对应功能可能下线"
      - element_id: "user-interaction"
        impact_level: "conditional"
        condition: "节点对应页面是否仍保留"

  - change_id: "PR-03"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "流程图重排"
      - element_id: "business-function"
        impact_level: "conditional"
        condition: "顺序变化是否影响功能描述操作步骤"
      - element_id: "user-interaction"
        impact_level: "conditional"
        condition: "顺序变化是否影响页面流转"

  - change_id: "PR-04"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "角色清单调整"
      - element_id: "business-function"
        impact_level: "certain"
        reason: "业务权限矩阵必然调整"

  - change_id: "PR-05"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "输入子要素更新"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "功能描述涉及的输入信息变化"
      - element_id: "user-interaction"
        impact_level: "likely"
        reason: "输入字段变化通常对应页面字段变化"

  - change_id: "PR-06"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "输出子要素更新"
      - element_id: "business-function"
        impact_level: "likely"
      - element_id: "user-interaction"
        impact_level: "conditional"
        condition: "输出是否在页面呈现"

  - change_id: "PR-07"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "业务规则子要素更新"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "功能描述可能引用规则"

  - change_id: "PR-08"
    affects:
      - element_id: "business-process"
        impact_level: "certain"
        reason: "活动明细异常处理字段更新"
      - element_id: "business-function"
        impact_level: "likely"
      - element_id: "user-interaction"
        impact_level: "conditional"
        condition: "异常处理是否需要新页面"

  # ─── FN 类映射 ────────────────────────────────────
  - change_id: "FN-01"
    affects:
      - element_id: "business-function"
        impact_level: "certain"
        reason: "功能清单/描述新增"
      - element_id: "business-process"
        impact_level: "certain"
        reason: "新功能通常对应新业务活动"
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "新功能必有页面承载"

  - change_id: "FN-02"
    affects:
      - element_id: "business-function"
        impact_level: "certain"
        reason: "功能描述调整"
      - element_id: "business-process"
        impact_level: "conditional"
        condition: "是否触达活动级变化"
      - element_id: "user-interaction"
        impact_level: "likely"
        reason: "操作步骤变化通常涉及页面"

  - change_id: "FN-03"
    affects:
      - element_id: "business-function"
        impact_level: "certain"
        reason: "功能清单删除"
      - element_id: "business-process"
        impact_level: "certain"
        reason: "对应活动同步下线"
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "对应页面同步下线"

  - change_id: "FN-04"
    affects:
      - element_id: "business-function"
        impact_level: "certain"
        reason: "业务权限矩阵更新"
      - element_id: "business-process"
        impact_level: "likely"
        reason: "角色清单可能调整"

  # ─── UI 类映射 ────────────────────────────────────
  - change_id: "UI-01"
    affects:
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "页面清单+流转+低保真新增"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "新页面通常对应新功能或扩展"
      - element_id: "business-process"
        impact_level: "conditional"
        condition: "新页面是否对应新活动"

  - change_id: "UI-02"
    affects:
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "低保真草图更新"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "字段变化常涉及功能描述"
      - element_id: "business-process"
        impact_level: "likely"
        reason: "输入信息可能同步变化"

  - change_id: "UI-03"
    affects:
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "页面流转更新"
      - element_id: "business-process"
        impact_level: "likely"
        reason: "流转变化通常映射流程顺序"

  - change_id: "UI-04"
    affects:
      - element_id: "user-interaction"
        impact_level: "certain"
        reason: "页面清单+流转更新"
      - element_id: "business-function"
        impact_level: "likely"
        reason: "对应功能可能下线"

  # ─── NF 类映射 ────────────────────────────────────
  - change_id: "NF-01"
    affects:
      - element_id: "non-functional-req"
        impact_level: "certain"
        reason: "性能要求子要素更新"

  - change_id: "NF-02"
    affects:
      - element_id: "non-functional-req"
        impact_level: "certain"
        reason: "信息安全 + 个人隐私保护 子要素更新"