element_types:
  # 基础信息要素
  - id: "original-requirement"
    name: "原始需求"
    chapter_no: 1
    chapter_no_cn: "一"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "1.1", name: "原始需求来源记录" }
      - { l2_no: "1.2", name: "原始需求描述" }
      - { l2_no: "1.3", name: "关键信息提取矩阵" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    always_affected_in: ["incremental"]
    description: "需求发起人提供的原始需求说明,支持文档导入(Word/PDF/HTML)或对话输入,标准化格式整理。"
    dual_input_mode: true

  - id: "business-background"
    name: "业务背景"
    chapter_no: 2
    chapter_no_cn: "二"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "2.1", name: "现状和痛点" }
      - { l2_no: "2.2", name: "目标和价值" }
      - { l2_no: "2.3", name: "业务范围" }
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    backend_only: false
    description: "现状痛点、目标价值、业务范围的结构化梳理。"

  - id: "requirement-type"
    name: "需求类型"
    chapter_no: 3
    chapter_no_cn: "三"
    chapter_label_style: "chinese"
    sub_elements: []
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: false
    backend_only: true                    # ⚠️ 关键：仅写 frontmatter，不写正文
    always_affected_in: ["incremental"]
    description: "TP/AP/AI/IT类型定性,确定后续功能模块路径。"

  # TP类型专用要素
  - id: "business-process"
    name: "业务流程"
    chapter_no: 4
    chapter_no_cn: "四"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "4.1", name: "业务流程图" }
      - { l2_no: "4.2", name: "活动总览" }
      - { l2_no: "4.3", name: "活动明细" }
      - { l2_no: "4.4", name: "角色清单" }
      - { l2_no: "4.5", name: "输入信息" }
      - { l2_no: "4.6", name: "输出结果" }
      - { l2_no: "4.7", name: "业务规则" }
      - { l2_no: "4.8", name: "外部依赖记录" }
    belongs_to: ["TP"]
    optional: false
    backend_only: false
    description: "流程概览、活动明细、角色职责、输入输出、业务规则、异常处理。"

  - id: "business-function"
    name: "业务功能"
    chapter_no: 5
    chapter_no_cn: "五"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "5.1", name: "功能清单" }
      - { l2_no: "5.2", name: "功能详细描述" }
      - { l2_no: "5.3", name: "业务权限矩阵" }
    belongs_to: ["TP"]
    optional: false
    backend_only: false
    description: "功能清单、功能描述、业务权限矩阵。"

  - id: "user-interaction"
    name: "用户交互"
    chapter_no: 6
    chapter_no_cn: "六"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "6.1", name: "页面清单" }
      - { l2_no: "6.2", name: "页面流转图" }
      - { l2_no: "6.3", name: "页面低保真草图" }
    belongs_to: ["TP"]
    optional: false
    backend_only: false
    description: "页面清单、页面流转、页面低保真草图。"

  # 公共要素
  - id: "non-functional-req"
    name: "非功能要求"
    chapter_no: 7
    chapter_no_cn: "七"
    chapter_label_style: "chinese"
    sub_elements:
      - { l2_no: "7.1", name: "性能要求" }
      - { l2_no: "7.2", name: "信息安全" }
      - { l2_no: "7.3", name: "个人隐私保护" }
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: true
    backend_only: false
    description: "性能要求、信息安全、个人隐私保护。"

  - id: "glossary"
    name: "概念术语"
    chapter_no: 8
    chapter_no_cn: "八"
    chapter_label_style: "chinese"
    sub_elements: []
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: false
    backend_only: false
    always_affected_in: ["incremental"]
    description: "业务术语、技术术语的定义与使用场景。"