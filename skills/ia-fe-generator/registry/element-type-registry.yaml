element_types:
  # 基础信息要素
  - id: "original-requirement"
    name: "原始需求"
    chapter_no: 1
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    description: "需求发起人提供的原始需求说明,支持文档导入(Word/PDF/HTML)或对话输入,标准化格式整理。"
    dual_input_mode: true  # 支持文档抽取 + 对话双模式

  - id: "business-background"
    name: "业务背景"
    chapter_no: 2
    belongs_to: ["TP", "AP", "AI"]
    optional: false
    description: "现状痛点、目标价值、业务范围的结构化梳理。"

  - id: "requirement-type"
    name: "需求类型"
    chapter_no: 3
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: false
    description: "TP/AP/AI/IT类型定性,确定后续功能模块路径。"

  # TP类型专用要素(已实现)
  - id: "business-process"
    name: "业务流程"
    chapter_no: 4
    belongs_to: ["TP"]
    optional: false
    description: "流程概览、活动明细、角色职责、输入输出、业务规则、异常处理。"

  - id: "business-function"
    name: "业务功能"
    chapter_no: 5
    belongs_to: ["TP"]
    optional: false
    description: "功能清单、功能描述、业务权限矩阵。"

  - id: "user-interaction"
    name: "用户交互"
    chapter_no: 6
    belongs_to: ["TP"]
    optional: false
    description: "页面清单、页面流转、页面低保真草图。"

  # 公共要素
  - id: "non-functional-req"
    name: "非功能要求"
    chapter_no: 7
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: true
    description: "性能要求、信息安全、个人隐私保护。"

  - id: "glossary"
    name: "概念术语"
    chapter_no: 8
    belongs_to: ["TP", "AP", "AI", "IT"]
    optional: false
    description: "业务术语、技术术语的定义与使用场景。"